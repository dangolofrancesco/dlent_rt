# DLENT-RT v6_size_bid (week 32): configs/v5_size_bid.yaml + bid.mode size_u0, u0 = 23.93 $/machine-hour (reports/week32/v6_bid.md).
# PHASE 0 CHANGES vs v5: the bid (and so phi, the customer value, the types and s_C) changes.
# DLENT-RT v5 configuration (week 32): configs/v4_300k.yaml + the size-based bid (bid.mode size: no per-job base
# utility; the bid grows with the requested resources and the duration) + f = 1.25 (fixed rule of the extended scan,
# reports/week32/bid_diagnosis.md). Quota = 0.2 x C with its fixed point, as in v4 (reports/week32/v5_size_bid.md).
run:
  name: "v6_size_bid"
  seed: 42                    # single seed controls every stochastic element
  output_dir: "runs"          # where per-step logs and summaries are written

# Data ingestion (week 32: scripts/data/fetch_v2.py -> scripts/data/build_v2.py)
data:
  batch_csv: "data/batch_v2_300k.csv"         # uniform 300k sample, a superset of the 30k one
  grid_csv: "data/grid_data_may_2019_filled.csv"   # hourly price / carbon, UTC; 1-3 June filled (scripts/data/fill_grid.py)
  n0: 10000                   # not used: h_days sets H
  h_days: 7.0                 # H = the jobs that arrive in the first 7 days
  columns:
    collection_id: "collection_id"
    datetime: "arrival_utc"                   # UTC with its time zone (the grid's time base)
    priority: "priority_tier"                 # Google tiers 1..5 (bin edges -1, 99, 115, 119, 359)
    scheduling_class: "scheduling_class"
    requested_cpu: "CPU"                      # SUM of the instances' first requests, in machines
    requested_ram: "RAM"
    duration_hours: "duration"                # job span; used only where the CPU request is 0
    cpu_hours_real: "CPU_hours_real"          # effective duration = CPU_hours_real / CPU request

# Time model. One duration per job (the effective duration, floored at 1 minute, cut at d_max), used for the time
# in the cluster, the bids and the energy.
time:
  tick_seconds: 1.0           # wall-clock seconds per step (real-tick time model, the only one)
  d_max_hours: null           # not used here: limits.d_cap_hours sets d_max
  d_max_horizon_fraction: 0.05  # HARD ceiling: d_max <= this * T (theory needs d_max << T)
  d_max_ratio_abort: 0.10     # abort with diagnostic if final d_max/T still exceeds this
  duration_floor_hours: 0.016667  # 1 minute = 1/60 hour


# Hardware profiles: they build ONLY the type id. Every request stays the real request; the type volume uses the
# mean real request of the type's jobs.
hardware:
  n_profiles: 32
  log_space: true             # k-means++ in log-space (requests span orders of magnitude)
  fit_on: "full"              # "full" (H+stream) | "H"
  hw_floor: 1.0e-5            # min hardware profile component; excludes degenerate
                              # k-means centroids from gamma's v_min term only


# Size limit
limits:
  r_max_machines: null        # off: the job quota below is the size rule of v3
  d_cap_hours: 24.0           # durations cut at 24 h (jobs kept); d_max = 24 h
  job_quota_machines: null    # not used by share_of_C
  job_quota_mem: null
  job_quota_rule: "share_of_C"  # Q_i = quota_share x C_i, fixed point on H (starts from the p99 of H)
  quota_share: 0.2
  xi_warn_threshold: 0.10     # warn if the data xi = max_i a_max,i / c_i exceeds this (~ 1/log T)

# Cluster capacity, sized on H + stream combined, on one shared timeline (data._size_capacity)
capacity:
  mode: "mean_demand"         # C_i = f * D_bar_i, D_bar_i = sum_{j in H} r_ij d_j / |H| (H only, after the quota)
  f: 1.25                     # fixed rule of the extended f scan (reports/week32/bid_diagnosis.md, 30.2%)
  exceeded_share: 0.25        # not used by mean_demand
  absolute:                   # used only when mode == "absolute" (machines)
    cpu: null
    ram: null

energy_model:
  # DECLARED ASSUMPTION (not from Google): the largest machine of the trace (1.0) has 64 cores and 256 GB.
  # Used only for bids and energy; requests and capacity stay in machines.
  machine_cores: 64
  machine_ram_gb: 256
  p_core: 15.0                # watts per physical core (Fan et al. 2007)
  p_gb: 0.35                  # watts per GB RAM
  pue: 1.10                   # power usage effectiveness

bid:
  mode: "size_u0"             # week 32 (v6): cost base = (u0 r + gamma1 cores + gamma2 GB) duration; no priority in the bid
  u0_per_machine_hour: 23.93  # $ per CPU machine-hour (Kash's value, now per machine-hour)
  # bid model (the only one): ln v = ln cost_base - sigma^2/2 + sigma Z, Z ~ N(0, 1)
  # Reserve prices ($/core-hour, $/GB-hour) in cost_base. CALIBRATED values, not
  # list prices: they are ~3.3x the 2024 GCP Preemptible n1-standard prices
  # (~$0.00996/core-hour, ~$0.00135/GB-hour), i.e. the same order of magnitude.
  # base_utility_u0 was calibrated WITH these values (scripts/calibrate_u0.py):
  # changing gamma1/gamma2 requires recalibrating base_utility_u0.
  gamma1: 0.0332                # $/core-hour reserve price
  gamma2: 0.00445               # $/GB-hour reserve price
  sigma: 0.3                  # log-space std of the markup v / cost_base (generator and known distribution)
  # Bid distribution KNOWN a priori (never refit): markup v / cost_base ~
  # LogNormal(-sigma^2/2, sigma), phi_v(v | c) = c * phi_m(v / c), the same phi in
  # Phase 0, ReInit and the online reward. false = legacy pooled-MLE ablation.
  known_distribution: true
  # Base utility rate ($/hour): minimum hourly value a user derives from job
  # completion, independent of resource footprint. Multiplied by duration.
  # Ref: reinterpretation suggested by advisor — demand-side utility rather
  # than supply-side fee.
  # U_0: the single free parameter of base_utility_mode. Calibrated via
  # scripts/calibrate_u0.py (bisection on Phase 0's pos_reward_types,
  # target_pos_frac=0.90) against sigma=0.3: if sigma is changed, this value
  # no longer hits that 90% target and should be recalibrated.
  base_utility_u0: 23.926
  base_utility_mode: "log"    # "linear" | "log"

normalization:
  # quantile_linear (the only normalization): carbon K [kgCO2] -> s_C * K [$]
  # (linear, through the origin; CV = customer value q*v), s_C = D_q / K_q with D_q = (Q_q(CV) + Q_q(|Pi|)) / 2,
  # K_q = Q_q(K), weighted quantiles over populated types. Computed once in Phase 0
  # and frozen. The reward stays in dollars (no divisor).
  quantile: 0.90

# Mechanism / objective weights
objective:
  lambda1: 1.0
  lambda2: 1.0
  lambda3: 1.0

# Discretization grid
grid:
  k_star: 128                  # fixed number of geometric bins (constant across phases)
  phi_floor: 1.0e-6           # clip Phi_min to avoid geometric-ratio blowup
  priority_classes: [1, 2, 3, 4, 5]

# Confidence / error parameters
confidence:
  delta: null                 # if null, set to 1/T^3 at runtime (T = online horizon)
  delta_power: 3              # delta = 1 / T^delta_power when delta is null

# Online model: only "theory" is implemented (paper-faithful: true D at admission,
# single counter, vanilla Bernoulli thinning). The practical ablations (delayed D,
# admission buffer, revision, phantoms) will add their keys when they are built.
model:
  kind: "theory"

scalarization:
  # "linear"    -> weighted sum (default). Reward keeps an absolute sign, which is
  #               what the online LP-RS admission oracle expects.
  # "chebyshev" -> augmented Chebyshev distance-to-ideal. Reaches non-convex Pareto
  #               regions, but produces reward <= 0 by construction: used directly
  #               as the LP-RS reward it makes the oracle admit nothing. Intended
  #               for offline Pareto-front enumeration in the analysis notebooks,
  #               NOT for the online loop.
  method: "linear"
  rho: 1.0e-3                 # augmentation term for augmented Chebyshev

oracle:
  kind: "frozen"              # only "frozen": phase-averaged grid costs (preserves Lemma 1)

# LP solver (HiGHS via highspy)
lp:
  presolve: true

# Test 3 cost control
test3:
  s_grid: "geometric"         # "geometric" | "full"
  geometric_base: 2           # s-checkpoints at tau_{m-1} + {0,1,2,4,8,...}

# Phase-transition fallback (thin types)
phase_transition:
  n_type_min: 5               # min observations for a type's stats to be trusted
  n_min: 80                   # min phase-arrival count to refit the grid (else reuse)
                              # (recommended: max(30, 5 * k_star))

# Logging granularity
logging:
  per_step: true              # full per-step parquet log
  per_phase: true             # per-phase summary
  short_phase_log: true       # dedicated short-phase / consecutive-short log

# --------------------------------------------------------------------------- #
# Online loop (week 28)
# --------------------------------------------------------------------------- #
constants:
  # System constants of Zhang & Cheung (2025, App. A). null = data-derived (Phase 0).
  # xi_override and gamma_override are FORCED, NOT DATA-JUSTIFIED: they are set by
  # hand so that the error parameters are not vacuous (eps_D = 0.50 and
  # 1 - eps_D - xi > 0 at xi = 0.001). On the data, xi = 0.951 at the week-32 scope
  # (reports/week32/limits_numbers.md; 0.5 on the week-30 data), so neither value
  # follows from the data. Their values are a closed decision (week 32).
  xi_override: 0.001
  gamma_override: 1.0
  # r_max in the data-derived gamma = p-weighted quantile of |r~| over populated
  # types (1.0 = max). 0.8 keeps the extreme phi(v) tail from dominating gamma.
  r_max_quantile: 0.8

tests:
  drop_dual_learning_terms: true   # Exact-LP: eps_E = eps_F = 0 (week 17)
  piecewise_tol: 1.0e-7   # ~ HiGHS default feasibility tolerance

online:
  bid_seed_offset: 1
  thinning_seed_offset: 2
