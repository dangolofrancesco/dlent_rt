# ============================================================================
# DLENT-RT default configuration
# ----------------------------------------------------------------------------
# Every experimental axis is a flag here so the ablation grid is a config sweep.
# Values are the paper-faithful / sensible defaults; override per experiment.
# ============================================================================

run:
  name: "default"
  seed: 42                    # single seed controls every stochastic element
  output_dir: "runs"          # where per-step logs and summaries are written
  log_level: "INFO"

# ----------------------------------------------------------------------------
# Data ingestion
# ----------------------------------------------------------------------------
data:
  batch_csv: "data/batch_may300k.csv"   # the fused per-job trace
  n0: 5000                    # first N0 rows -> historical batch H (offline, Phase 0)
                              # remainder -> online stream (never reuses H)
  # Column names in the CSV (kept explicit so a schema change is a config edit,
  # not a code edit).
  columns:
    collection_id: "collection_id"
    datetime: "job_datetime"
    q: "q_j"
    a_cpu: "A_cpu"
    a_ram: "A_ram"
    duration_hours: "D (hours)"
    v_rate: "v_rate"
    phi_rate: "phi_rate"
    w_kw: "w_j_kw"
    elec_price: "elec_price_per_kWh"
    carbon_intensity: "carbon_intensity_gCO2_per_kWh"
    c_elec: "C_elec"
    c_carbon: "C_carbon"

# ----------------------------------------------------------------------------
# Time model
# ----------------------------------------------------------------------------
time:
  # One step = one arrival (decision A1). Durations given in hours must be
  # converted to an integer number of *arrival-steps*. The conversion uses the
  # empirical arrival rate (arrivals per hour) estimated from the trace.
  step_semantics: "one_arrival"
  duration_unit: "hours"      # native unit of the D column
  d_max_quantile: 0.95        # d_max candidate = this quantile of step-durations
  d_max_horizon_fraction: 0.05  # HARD ceiling: d_max <= this * T (theory needs d_max << T)
  d_max_ratio_abort: 0.10     # abort with diagnostic if final d_max/T still exceeds this

# ----------------------------------------------------------------------------
# Hardware profile discretization
# ----------------------------------------------------------------------------
# Real Google-trace resource requests are continuous floats (near-unique per
# job), which explodes the type space. We snap each job's (A_cpu, A_ram) to one
# of a small fixed catalogue of canonical VM shapes, fitted on the FULL trace
# (VM shapes are a static provider-side fact, not something learned online).
hardware:
  n_profiles: 12              # number of canonical shapes
  method: "kmeans"            # "kmeans" | "quantile_grid"
  log_space: true             # cluster in log-space (requests span orders of magnitude)
  fit_on: "full"              # "full" (H+stream) | "H"

# ----------------------------------------------------------------------------
# Outlier handling (resource requests and durations)
# ----------------------------------------------------------------------------
# The paper's guarantee needs a_max/c_i <= O(1/log T) and d_max << T. Raw trace
# extremes (e.g. a collection aggregating thousands of tasks) violate these. We
# drop the tail rather than clip, to keep every retained job's value exact.
outliers:
  policy: "drop"              # "drop" | "clip"
  a_max_quantile: 0.99        # resource-request cutoff (per resource, on the trace)
  d_max_quantile: 0.95        # duration cutoff (hours); jobs longer are dropped/clipped
  # xi safety check: warn if max_i a_max,i / c_i exceeds this after handling
  xi_warn_threshold: 0.10     # ~ 1/log(T) for T ~ 25k

# ----------------------------------------------------------------------------
# Cluster capacity
# ----------------------------------------------------------------------------
capacity:
  # mode "fraction_of_volume": c_i = fraction * sum_j (A_ij * D_j)  [core-hours]
  #   Matches the static simulator's b_i = rho * sum_j V_ij (load factor rho).
  #   This is the DEFAULT and makes the fluid LP bind correctly.
  # mode "fraction_of_peak": c_i = fraction * peak concurrent occupancy of
  #   resource i over the online stream (physically meaningful "80% of peak").
  # mode "absolute": c_i taken directly from `absolute` below (real deployments).
  mode: "fraction_of_volume"
  fraction: 0.60              # load factor rho (static sim used 0.60)
  absolute:                   # used only when mode == "absolute"
    cpu: null
    ram: null

# ----------------------------------------------------------------------------
# Mechanism / objective weights
# ----------------------------------------------------------------------------
objective:
  lambda1: 1.0                # customer satisfaction weight
  lambda2: 1.0                # provider profit weight
  lambda3: 1.0                # sustainability (carbon) weight
  scc: 0.05                   # social cost of carbon ($ per gram CO2)
  pue: 1.10                   # power usage effectiveness
  cpu_watts: 4.0              # per-unit CPU power draw (for w_j if recomputed)
  ram_watts: 0.5              # per-unit RAM power draw
  normalize: true             # normalize each objective to [0,1] via utopian z*
                              # (matches static sim; makes Chebyshev rewards
                              #  comparable and the r>=0 admissibility test valid)

# ----------------------------------------------------------------------------
# Discretization grid
# ----------------------------------------------------------------------------
grid:
  k_star: 256                  # fixed number of geometric bins (constant across phases)
  phi_floor: 1.0e-6           # clip Phi_min to avoid geometric-ratio blowup
  priority_classes: [1, 2, 3, 4, 5]

# ----------------------------------------------------------------------------
# Confidence / error parameters
# ----------------------------------------------------------------------------
confidence:
  delta: null                 # if null, set to 1/T^3 at runtime (T = online horizon)
  delta_power: 3              # delta = 1 / T^delta_power when delta is null

# ----------------------------------------------------------------------------
# Experimental axes (the ablation grid)
# ----------------------------------------------------------------------------
model:
  # "theory"    -> paper-faithful: true D at admission, single counter, vanilla Bernoulli
  # "practical" -> realistic: delayed D, dual counters, four-case gate, strategy-D
  kind: "theory"

scalarization:
  # "chebyshev"     -> canonical, single LP, reaches non-convex Pareto (default)
  # "linear"        -> naive baseline
  # "eps_constraint"-> for Pareto enumeration only (not inside the online loop)
  method: "chebyshev"
  rho: 1.0e-3                 # augmentation term for augmented Chebyshev

oracle:
  # "frozen"     -> uses phase-averaged grid costs (preserves Lemma 1)
  # "time_aware" -> substitutes live grid prices at decision time
  # theory model uses frozen; practical model uses time_aware by default,
  # but this flag lets you cross them for the ablation.
  kind: "frozen"

admission:
  a_buffer_fraction: 1.0      # a_buffer = fraction * a_max  (practical model only)
                              # 1.0 = as conservative as Test 1; 0.0 = max packing

revision:
  # "continuous"     -> re-revise every in-flight job every step (max rule)
  # "at_completion"  -> single O(1) revision when the job finishes
  mode: "continuous"

phantom:
  # whether Case-B phantoms are re-revised in the in-flight loop (Step 3)
  revise_in_flight: false     # default: keep "what DLENT would have earned" semantics

# ----------------------------------------------------------------------------
# LP solver
# ----------------------------------------------------------------------------
lp:
  solver: "highs"             # highspy
  warm_start: true            # reuse basis across Test-3 windows
  presolve: true

# ----------------------------------------------------------------------------
# Test 3 cost control
# ----------------------------------------------------------------------------
test3:
  s_grid: "geometric"         # "geometric" | "full"
  geometric_base: 2           # s-checkpoints at tau_{m-1} + {0,1,2,4,8,...}

# ----------------------------------------------------------------------------
# Phase-transition fallback (thin types)
# ----------------------------------------------------------------------------
phase_transition:
  n_type_min: 5               # min observations for a type's stats to be trusted
  n_min: 80                   # min phase-arrival count to refit the grid (else reuse)
                              # (recommended: max(30, 5 * k_star))
  short_phase_tracking: true  # log short / consecutive-short phases

# ----------------------------------------------------------------------------
# Logging granularity
# ----------------------------------------------------------------------------
logging:
  per_step: true              # full per-step parquet log
  per_phase: true             # per-phase summary
  short_phase_log: true       # dedicated short-phase / consecutive-short log
