# DLENT-RT, the final model (week 33, decisions D1-D6; reports/week33/model_check.md).
# The ONE configuration. The model variants are switches inside it:
#   theoretical model  oracle.kind frozen, ablation.thinning_off false, bid.refit_sigma true   (as written here)
#   practical model    oracle.kind live,   ablation.thinning_off true
#   no-learning model  the Phase 0 state forever (models.policy.NoLearningPolicy); sigma = bid.sigma, never refit
run:
  name: "default"
  seed: 42                    # single seed controls every stochastic element
  output_dir: "runs"          # where per-step logs and summaries are written

# Data (scripts/data/fetch_v2.py -> scripts/data/build_v2.py; the grid file is filled by scripts/data/fill_grid.py)
data:
  batch_csv: "data/batch_v2_300k.csv"              # relative paths: to the repository root
  grid_csv: "data/grid_data_may_2019_filled.csv"   # hourly price / carbon, UTC
  h_days: 7.0                                      # D3: H = the jobs that arrive in the first 7 days
  columns:
    collection_id: "collection_id"
    datetime: "arrival_utc"                   # UTC with its time zone (the grid's time base)
    priority: "priority_tier"                 # Google tiers 1..5 (bin edges -1, 99, 115, 119, 359)
    scheduling_class: "scheduling_class"
    requested_cpu: "CPU"                      # SUM of the instances' first requests, in machines
    requested_ram: "RAM"
    duration_hours: "duration"                # job span; used only where the CPU request is 0
    cpu_hours_real: "CPU_hours_real"          # effective duration = CPU_hours_real / CPU request

# D3: one duration per job = the effective duration, floored at 1 minute, cut at 24 h (jobs kept). No outlier
# filters. Used for the time in the cluster, the bids and the energy. d_max = 24 h.
time:
  tick_seconds: 1.0
  d_cap_hours: 24.0
  duration_floor_hours: 0.016667  # 1 minute
  d_max_ratio_abort: 0.10         # abort if d_max / T exceeds this (the theory needs d_max << T)

# Hardware profiles: they build ONLY the type id. Every request stays the real request.
hardware:
  n_profiles: 32
  log_space: true             # k-means++ in log space
  fit_on: "full"              # "full" (H + stream) | "H"
  hw_floor: 1.0e-5            # only for gamma's v_min term

# D3: job quota Q_i = 0.2 x C_i of the cluster actually used (fixed point on H until Q moves by < 1%)
limits:
  quota_share: 0.2
  quota_tol: 0.01
  xi_warn_threshold: 0.10

# D3: C_i = f x D_bar_i, D_bar_i = sum_{j in H} r_ij d_j / |H|. ONE cluster for every model.
capacity:
  # f rule (week 33, made explicit after the notebook preview), over f in {0.3, 0.35, 0.4, 0.45, 0.5}:
  #   (a) REQUIRED: tau > 0 (CPU or RAM) in both the Phase 0 LP and fluid OPT;
  #   (b) among those, the static Phase 0 policy's "% time >= 95% full" closest to the 20-30% band.
  # Every f of the scan passes (a); 0.5 is the closest to the band (44.6%; none is inside). See
  # notebooks/01_model_check.ipynb, section 6, and reports/week33/model_check.md.
  f: 0.5
  job_level_enlarge: false    # off: enlarge C only if job-level models reject > 50% of positive-reward jobs for space
  job_level_reject_max: 0.5
  job_level_enlarge_step: 1.25

energy_model:
  # DECLARED ASSUMPTION (not from Google): the largest machine of the trace (1.0) has 64 cores and 256 GB.
  machine_cores: 64
  machine_ram_gb: 256
  p_core: 15.0                # watts per physical core (Fan et al. 2007)
  p_gb: 0.35                  # watts per GB RAM
  pue: 1.10                   # power usage effectiveness

# D2: cost_base = (U0 (1 + ln q) + gamma1 cores + gamma2 GB) d, v ~ lognormal with mean cost_base.
# U0 = gamma1 cores + gamma2 GB of the median H job (by that rate), computed in Phase 0, then fixed.
bid:
  gamma1: 0.0332              # $ per vCPU-hour
  gamma2: 0.00445             # $ per GiB-hour
  sigma: 0.3                  # log-space std of the markup v / cost_base
  refit_sigma: true           # theoretical model: sigma refit on the markups in Phase 0 and at every ReInit

# D1: s_C = D_q / K_q, D_q = (Q_0.9(V) + Q_0.9(|Pi|)) / 2, K_q = Q_0.9(K), over H's types, frozen at Phase 0
normalization:
  quantile: 0.90

# D1: R = lambda1 V + lambda2 Pi - lambda3 s_C K, linear, all lambda = 1
objective:
  lambda1: 1.0
  lambda2: 1.0
  lambda3: 1.0

# D4: geometric grid on bids, 128 bins between the smallest and the largest bid
grid:
  k_star: 128
  priority_classes: [1, 2, 3, 4, 5]

confidence:
  delta: null                 # null -> 1 / T^3
  delta_power: 3

# D5: frozen (theoretical) | live (practical: the job's own costs at arrival)
oracle:
  kind: "frozen"

lp:
  presolve: true

test3:
  s_grid: "geometric"
  geometric_base: 2           # s-checkpoints at tau_{m-1} + {0, 1, 2, 4, 8, ...}

phase_transition:
  n_type_min: 5               # min observations for a type's stats to be trusted
  n_min: 80                   # min phase-arrival count to refit the grid (else reuse)

logging:
  per_step: true
  per_phase: true
  short_phase_log: true
  progress_every: 0.10        # a progress line every 10% of the arrivals (0 = off)
  progress_phases: true       # a line at every phase end

# D5: xi and gamma FORCED (not data-justified). Test 1 threshold = (1 - xi) c.
constants:
  xi_override: 0.001
  gamma_override: 1.0
  r_max_quantile: 0.8         # quantile of |r~| in the DATA gamma only; Tests 2-3 unit = max positive r~ of Phase 0

tests:
  drop_dual_learning_terms: true   # exact LP-RS: eps_E = eps_F = 0
  piecewise_tol: 1.0e-7

online:
  bid_seed_offset: 1
  thinning_seed_offset: 2

# D5: practical model = thinning off (with oracle.kind live)
ablation:
  thinning_off: false
