# Week 32, step 2: the new data path (reports/week32/data_v2.md). The old path (configs/default.yaml, the old
# data file) is unchanged. Every key not set here falls back to the dataclass defaults, which equal the committed
# configs/default.yaml (tests/test_config_defaults.py); xi_override and gamma_override stay forced as there.
data:
  batch_csv: "data/batch_v2_30k.csv"      # scripts/data/fetch_v2.py + scripts/data/build_v2.py
  time_base: "utc"                        # arrival_utc = 2019-05-01 07:00 UTC + (t - 600 s), same base as the grid
  columns:
    datetime: "arrival_utc"
    priority: "priority_tier"             # Google tiers 1..5 (bin edges -1, 99, 115, 119, 359)
    requested_cpu: "CPU"                  # SUM of the instances' first requests (machines)
    requested_ram: "RAM"

time:
  d_max_hours: 23.0                       # cap on the job duration; the code also needs d_max <= 0.05 T
  cap_duration_everywhere: true           # one duration: time in the cluster, bids and energy
  duration_mode: "effective"              # step 3: duration = CPU_hours_real / CPU request (not the job span)

hardware:
  snap_requests: false                    # profiles only build the type id; A = the real request

outliers:
  policy: "none"                          # no outlier filter

capacity:
  mode: "exceeded_share"                  # c_i = the demand level exceeded 25% of the time, every job admitted
  exceeded_share: 0.25
  drop_jobs_exceeding_capacity: false

energy_model:
  machine_cores: 64                       # DECLARED ASSUMPTION (not from Google): the largest machine = 64 cores
  machine_ram_gb: 256                     # DECLARED ASSUMPTION (not from Google): the largest machine = 256 GB
