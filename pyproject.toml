[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlent-rt"
version = "0.1.0"
description = "Real-time DLENT-Exact simulator for multi-objective cloud resource allocation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "highspy>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyarrow>=12.0"]
notebooks = ["matplotlib>=3.7", "jupyter", "pyarrow>=12.0"]

[tool.setuptools.packages.find]
include = ["dlent_rt*"]
